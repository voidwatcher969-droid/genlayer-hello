// contoh minimal — ganti address setelah deploy
const log = (m)=> document.getElementById('log').textContent += m + "\n";
document.getElementById('connect').onclick = async ()=>{
  log("Connecting... (pakai window.ethereum)");
  // ... demo only
  log("Connected mock 0xc4D0...");
};
document.getElementById('create').onclick = ()=>{
  log("Create escrow: seller 0x1234..., evidence https://github.com/voidwatcher969-droid/genlayer-hello");
  log(" (deploy dulu via genlayer deploy contracts/escrow.py)");
};
